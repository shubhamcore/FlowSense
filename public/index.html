function calibrationPage(){return shell('Visual calibration studio','Map camera pixels into meaningful floor coordinates and reject unsafe geometry before analytics run.','CAMERA CALIBRATION',`<button class="btn ghost" id="calClear">Clear points</button><button class="btn primary" id="solveCal">Solve homography →</button>`)+`<div class="status-strip"><div class="status-left"><span class="live-dot"></span><strong>Camera 03 · Checkout</strong><span>Calibration state: ${state.cal.result?state.cal.result.quality:'needs four point pairs'}</span></div><div class="status-meta">Target reprojection error ≤ 0.35m</div></div><div class="calibration-layout"><section class="panel calibration-panel"><div class="panel-title">1 · Camera space</div><div class="panel-sub">Click four stable reference points in the camera frame.</div>${calibrationCanvas('source')}<div class="calibration-instructions">Use aisle corners, checkout corners or fixed shelf intersections. Do not click moving people.</div></section><section class="panel calibration-panel"><div class="panel-title">2 · Floor space</div><div class="panel-sub">Click the corresponding points on the store floor plan.</div>${calibrationCanvas('floor')}<div class="calibration-instructions">Points must be entered in the same order as the camera frame. Floor coordinates are metres.</div></section></div>${state.cal.result?`<div class="calibration-result"><strong>Calibration ${state.cal.result.quality}</strong> · mean reprojection error ${state.cal.result.reprojection_error_m}m · ${state.cal.result.points_used} anchors used · stored per camera calibration.</div>`:'<div class="calibration-result" style="border-color:rgba(255,180,84,.2);background:rgba(255,180,84,.05);color:#ffc87b">Calibration is a measured configuration. Analytics should remain blocked until the geometry passes review.</div>'}`}
function settingsPage(){return shell('Workspace settings','Configure data retention, zone thresholds and the operating guardrails behind every insight.','CONFIGURATION',`<button class="btn primary" id="saveSettings">Save changes</button>`)+`<div class="setting-grid"><section class="panel setting-panel"><div class="panel-title">Privacy & retention</div><div class="setting-row"><div><strong>Face masking</strong><p>Blur before any derived data is stored.</p></div><span class="switch on"><i></i></span></div><div class="setting-row"><div><strong>Raw video retention</strong><p>Delete source footage after processing.</p></div><select class="input"><option>24 hours</option><option>7 days</option><option>30 days</option></select></div><div class="setting-row"><div><strong>Trajectory retention</strong><p>Keep anonymous paths for analytics.</p></div><select class="input"><option>90 days</option><option>180 days</option></select></div></section><section class="panel setting-panel"><div class="panel-title">Analytics thresholds</div><div class="setting-row"><div><strong>Transit threshold</strong><p>Visits shorter than this stay are transit.</p></div><label><input class="input" value="2" style="width:65px"> sec</label></div><div class="setting-row"><div><strong>Dwell threshold</strong><p>Stay above this is classified as dwell.</p></div><label><input class="input" value="5" style="width:65px"> sec</label></div><div class="setting-row"><div><strong>Bottleneck alert</strong><p>Composite score required to alert.</p></div><label><input class="input" value="40" style="width:65px"> /100</label></div></section><section class="panel setting-panel"><div class="panel-title">Camera health</div><div class="list">${[['CAM-01','Entrance / west','ONLINE','24.0 FPS'],['CAM-02','Center aisle','ONLINE','23.7 FPS'],['CAM-03','Checkout','DEGRADED','12.2 FPS'],['CAM-04','Home care','ONLINE','24.1 FPS']].map(c=>`<div class="list-row" style="cursor:default"><span class="live-dot" style="background:${c[2]==='ONLINE'?'#42d8ca':'#ffb454'}"></span><div class="row-main"><div class="row-name">${c[0]} · ${c[1]}</div><div class="row-meta">${c[3]}</div></div><span style="font-size:10px;color:${c[2]==='ONLINE'?'#87e0aa':'#ffc279'}">${c[2]}</span></div>`).join('')}</div></section><section class="panel setting-panel"><div class="panel-title">Pipeline health</div><div class="list">${['Video ingestion','Person detection','BoT-SORT tracking','Homography calibration','Zone assignment','Insight generation'].map((x,i)=>`<div class="list-row" style="cursor:default"><span style="color:#80e2a8">✓</span><div class="row-main"><div class="row-name">${x}</div><div class="row-meta">${i===2?'11 active anonymous tracks':'healthy · last run 14:32'}</div></div><span style="font-size:10px;color:#80e2a8">READY</span></div>`).join('')}</div></section></div><div class="panel trust-card" style="margin-top:16px"><div class="panel-title">Production perimeter <span class="confidence-pill">PILOT READY</span></div><div class="panel-sub">Operational guardrails for a multi-store deployment</div><div class="trust-grid"><div class="trust-item"><strong style="color:#8fe9df">YOLO11 + BoT-SORT</strong><span>person-only GPU inference adapter</span></div><div class="trust-item"><strong style="color:#8fe9df">Redis GPU queue</strong><span>async jobs · retryable status</span></div><div class="trust-item"><strong style="color:#8fe9df">TimescaleDB</strong><span>hypertable for track points</span></div><div class="trust-item"><strong style="color:#8fe9df">JWT tenant scope</strong><span>store access claims enforced</span></div><div class="trust-item"><strong style="color:#8fe9df">24h raw retention</strong><span>private object storage lifecycle</span></div><div class="trust-item"><strong style="color:#8fe9df">Prometheus SLOs</strong><span>queue, latency, confidence, FPS</span></div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px"><span style="color:#7896aa;font-size:10px">Calibration quality · camera 03 requires review</span><button class="btn small" id="calibrateBtn">Open calibration wizard →</button></div></div>`}
function render(){
 const pages={overview,live:livePage,journeys:journeysPage,sections:sectionsPage,bottlenecks:bottlenecksPage,deadzones:deadzonesPage,insights:insightsPage,simulator:simulatorPage,experiments:experimentsPage,proof:proofPage,operations:operationsPage,genome:genomePage,analyst:analystPage,settings:settingsPage,calibration:calibrationPage};
 document.getElementById('appView').innerHTML=pages[state.page]();
 document.getElementById('crumbPage').textContent=state.page==='deadzones'?'Dead zones':state.page[0].toUpperCase()+state.page.slice(1);
 document.querySelectorAll('#navMain button,.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===state.page));
 bind();
}
function toast(text){const root=document.getElementById('toastRoot');root.innerHTML=`<div class="toast">${text}</div>`;setTimeout(()=>root.innerHTML='',3500)}
let guideIndex=0;
function openGuide(){guideIndex=0;document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop guided-modal" id="guideBg"><div class="modal"><div class="modal-head"><div><div class="eyebrow">JUDGE MODE</div><h2>FlowSense in 90 seconds</h2><p>Tell the story in the same order the product creates value: observe, explain, act.</p></div><button class="icon-btn" id="closeGuide">×</button></div><div class="guide-hero"><strong id="guideTitle">1 · Observe the store</strong><span id="guideCopy">Existing camera feeds become an anonymous floor-space signal. No names, faces or demographic inference.</span></div><div class="guide-steps">${[['Observe','camera signal'],['Understand','journeys'],['Diagnose','friction'],['Recommend','next test'],['Measure','experiment']].map((x,i)=>`<div class="guide-step ${i===0?'active':''}" data-guide-step="${i}"><b>${i+1}</b>${x[0]}<br><span>${x[1]}</span></div>`).join('')}</div><div class="hypothesis" style="margin:0"><strong>Presenter cue</strong><span id="guideCue">“Retail stores already have cameras. The problem is that those cameras watch customers, but do not understand them.”</span></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:17px"><span style="color:#7796aa;font-size:10px">Built for a sub-5-minute demo</span><button class="btn primary" id="guideNext">Next signal →</button></div></div></div>`;document.getElementById('closeGuide').onclick=closeModal;document.getElementById('guideBg').onclick=e=>{if(e.target.id==='guideBg')closeModal()};document.getElementById('guideNext').onclick=nextGuide;document.querySelectorAll('[data-guide-step]').forEach(x=>x.onclick=()=>{guideIndex=+x.dataset.guideStep;updateGuide()})}
function updateGuide(){const content=[['1 · Observe the store','Existing camera feeds become an anonymous floor-space signal. No names, faces or demographic inference.','“Retail stores already have cameras. The problem is that those cameras watch customers, but do not understand them.”'],['2 · Understand behavior','Trajectory reconstruction separates traffic density from dwell, speed and stop behavior.','“We can now see where customers move and where they stop.”'],['3 · Diagnose friction','Aisle 4 is not merely busy: density is +184%, speed is −43%, dwell is +67%, and two paths intersect.','“The important part is not the heatmap. It is the evidence chain.”'],['4 · Recommend an intervention','The system turns evidence into a test: move the promo display 0.8–1.2m away from the path conflict.','“Now we can ask the retailer what to do next.”'],['5 · Measure the change','Simulation is clearly labeled. Experiments wait for enough comparable data before claiming a winner.','“FlowSense does not replace the retailer’s decision. It gives them the evidence to make a better one.”']][guideIndex];document.getElementById('guideTitle').textContent=content[0];document.getElementById('guideCopy').textContent=content[1];document.getElementById('guideCue').textContent=content[2];document.querySelectorAll('[data-guide-step]').forEach((x,i)=>x.classList.toggle('active',i===guideIndex));document.getElementById('guideNext').textContent=guideIndex===4?'Open bottleneck intelligence →':'Next signal →'}
function nextGuide(){if(guideIndex<4){guideIndex++;updateGuide()}else{closeModal();state.page='bottlenecks';render();toast('Guided story complete · continue with the evidence chain')}}
function openUpload(){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" id="modalBg"><div class="modal"><div class="modal-head"><div><h2>Ingest camera footage</h2><p>Use an MP4 from a standard CCTV camera. The demo falls back to a deterministic store dataset so the story stays reliable.</p></div><button class="icon-btn" id="closeModal">×</button></div><label class="dropzone" for="videoInput"><strong>Drop MP4 footage here or choose a file</strong><span>Max 500 MB · camera space accepted · no faces stored</span><input id="videoInput" type="file" accept="video/mp4,.mp4" style="display:none"></label><div class="pipeline" id="pipeline"><div class="pipe"><i>1</i>Video ingestion</div><div class="pipe"><i>2</i>Person detection</div><div class="pipe"><i>3</i>Anonymous tracking</div><div class="pipe"><i>4</i>Trajectory reconstruction</div><div class="pipe"><i>5</i>Zone + dwell analysis</div><div class="pipe"><i>6</i>Insights + recommendations</div></div><div style="display:flex;justify-content:space-between;align-items:center;margin-top:18px"><span id="uploadStatus" style="color:#7896aa;font-size:11px">No file selected · try the deterministic demo</span><button class="btn primary" id="demoRun">Use demo dataset →</button></div></div></div>`;document.getElementById('closeModal').onclick=closeModal;document.getElementById('modalBg').onclick=e=>{if(e.target.id==='modalBg')closeModal()};document.getElementById('demoRun').onclick=()=>runPipeline('demo_store.mp4');document.getElementById('videoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!/\.mp4$/i.test(f.name)){document.getElementById('uploadStatus').textContent='Unsupported file. FlowSense accepts MP4 in this pilot.';document.getElementById('uploadStatus').style.color='#ff9c92';return}runPipeline(f)} }
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function runPipeline(input){const actualFile=typeof input==='object'?input:null;const filename=actualFile?actualFile.name:input;const status=document.getElementById('uploadStatus');status.textContent=`Processing ${filename} · derived analytics only`;status.style.color='#9fe8df';if(actualFile){const form=new FormData();form.append('file',actualFile);fetch('/api/videos/process',{method:'POST',body:form}).then(r=>r.json()).then(d=>{if(d.error)throw new Error(d.error);status.textContent=`${d.backend||'CV'} complete · ${d.analytics?.tracks||0} anonymous tracks`;toast('Local CV run complete · no identity features stored')}).catch(()=>{status.textContent='CV worker unavailable · deterministic demo fallback remains active';status.style.color='#ffc77b'})}document.querySelectorAll('.pipe').forEach(x=>x.classList.remove('active','done'));let i=0;const tick=()=>{const rows=document.querySelectorAll('.pipe');if(i>0)rows[i-1].classList.add('done');if(i<rows.length){rows[i].classList.add('active');i++;setTimeout(tick,350)}else{rows[rows.length-1].classList.add('done');status.textContent='Complete · dashboard populated with SYNTHETIC demo analytics';document.getElementById('demoRun').textContent='Open dashboard →';document.getElementById('demoRun').onclick=()=>{closeModal();state.page='overview';render();toast('Demo analytics loaded · provenance labels preserved')}}};tick()}
function runSimulation(){const base={congestion:42,dead_zone_exposure:68,journey_efficiency:71};let congestion=base.congestion,dead=base.dead_zone_exposure,journey=base.journey_efficiency;if(state.sim.display){congestion*=.762;dead*=.84;journey+=8}if(state.sim.aisle){congestion*=.81;dead*=.92;journey+=11}state.simulation={congestion:+congestion.toFixed(1),dead:+dead.toFixed(1),journey:+Math.min(100,journey).toFixed(1)};render();toast('Simulation complete · results labeled SIMULATED, not observed')}
async function ask(q){state.chat.push({role:'user',text:q});render();let answer='FlowSense sees 1,248 visitors. Fresh produce leads section health at 91/100, while Aisle 4 is the clearest friction. Ask about bottlenecks, dead zones or interventions.';let evidence='Grounded in current analytics snapshot';try{const r=await fetch('/api/ai/query',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});if(r.ok){const d=await r.json();answer=d.answer;evidence=d.evidence.join(' · ')}}catch(e){if(/stuck|bottleneck/i.test(q)){answer='Prioritize Aisle 4 intersection. Density is +184% versus baseline, speed is down 43%, and dwell is up 67% across 327 affected visitors. The evidence supports a path-conflict hypothesis near the promotional display.';evidence='Density +184% · Speed −43% · Dwell +67% · 327 affected visitors'}else if(/dead|underperform/i.test(q)){answer='Zone F · Home care is the clearest underutilized opportunity: traffic is 7.8% versus a 34.2% store average, and dwell is 18 seconds versus 71 seconds. Test a visibility-led intervention.';evidence='Traffic 7.8% vs 34.2% · Dwell 18s vs 71s · Opportunity 91/100'}}state.chat.push({role:'ai',text:answer});render();toast('Answer grounded in store analytics')}
function svgCalibrationPoint(side,event){const svg=document.getElementById(`${side}Plane`);const rect=svg.getBoundingClientRect();const width=side==='floor'?20:640;const height=side==='floor'?12:360;return [+(Math.max(0,Math.min(width,(event.clientX-rect.left)/rect.width*width))).toFixed(3),+(Math.max(0,Math.min(height,(event.clientY-rect.top)/rect.height*height))).toFixed(3)]}
function addCalibrationPoint(side,event){if(state.cal[side].length>=4){toast('Four anchors are already placed. Clear them to start again.');return}state.cal[side].push(svgCalibrationPoint(side,event));state.cal.result=null;render()}
async function solveCalibration(){if(state.cal.source.length!==4||state.cal.floor.length!==4){toast('Place four camera points and four matching floor points first');return}try{const r=await fetch('/api/calibration/solve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({source_points:state.cal.source,floor_points:state.cal.floor,max_error_m:.35})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Calibration rejected');state.cal.result=data.calibration;render();toast(`Calibration ${data.calibration.quality} · error ${data.calibration.reprojection_error_m}m`)}catch(error){toast('Calibration API unavailable · connect the production API before saving geometry')}}
async function runCausalAnalysis(){try{const r=await fetch('/api/experiments/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:'Promo display relocation',hypothesis:'Moving the display reduces congestion without reducing checkout reach',primary_metric:'congestion',direction:'decrease',minimum_sample_per_arm:30,baseline:[42,41,43,42,44,40,43,41,42,44,41,42],variant:[34,35,33,34,35,36,34,33,35,34,36,35]})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Analysis failed');state.causalResult=data;toast(`${data.decision} · sample ${data.sample_sufficient?'sufficient':'insufficient'}`);render()}catch(error){toast('Causal analysis API unavailable')}}
async function refreshActions(){try{const r=await fetch('/api/actions');const data=await r.json();state.actions=data.items||[];render();toast('Action loop refreshed')}catch(error){toast('Action API unavailable')}}
async function createQuickAction(){try{const r=await fetch('/api/actions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:'Test Zone F sightline',problem:'Zone F is underexposed',intervention:'Move a visibility-led display into the sightline',owner:'Store operator',due_date:'2026-10-15',success_metric:'zone exposure',hypothesis:'Improving sightline increases Zone F exposure without creating a new bottleneck',source_recommendation_id:'rec-2'})});if(!r.ok)throw new Error('create failed');await refreshActions()}catch(error){toast('Could not create action')}}
async function completeAction(id){try{const r=await fetch(`/api/actions/${id}/complete`,{method:'POST'});if(!r.ok)throw new Error('complete failed');await refreshActions();toast('Action completed · now awaiting measurement')}catch(error){toast('Could not complete action')}}
async function measureAction(id){try{const r=await fetch(`/api/actions/${id}/measure`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({baseline:[42,41,43,42,44,40,43,41,42,44,41,42],after:[34,35,33,34,35,36,34,33,35,34,36,35],minimum_sample_per_arm:30})});if(!r.ok)throw new Error('measure failed');await refreshActions();toast('Measurement recorded · sample-size guardrail applied')}catch(error){toast('Could not record measurement')}}
async function refreshGenome(){try{const r=await fetch('/api/flow-genome');if(!r.ok)throw new Error('genome failed');state.genome=await r.json();render();toast('Flow Genome recomputed · aggregate behavior only')}catch(error){toast('Genome API unavailable')}}
function bind(){
 document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>{state.page=x.dataset.page;render()});
 document.querySelectorAll('.map-mode').forEach(x=>x.onclick=()=>{state.mapMode=x.dataset.mode;render()});
 const replay=document.getElementById('replayRange');if(replay)replay.oninput=()=>{const mins=Math.round((+replay.value/100)*26);const mm=String(32-Math.floor(mins/60)).padStart(2,'0');const ss=String((8-mins%60+60)%60).padStart(2,'0');document.getElementById('replayTime').textContent=`14:${mm}:${ss}`};document.getElementById('replayBtn')?.addEventListener('click',()=>toast('Replay scrubbing is operating on the demo snapshot · no identity is retained'));
 document.querySelectorAll('[data-select]').forEach(x=>x.onclick=()=>{state.selected=x.dataset.select;state.page='overview';render();toast('Focused map on selected friction zone')});
 document.querySelectorAll('[data-toggle]').forEach(x=>x.onclick=()=>{if(x.dataset.toggle==='display')state.sim.display=!state.sim.display;if(x.dataset.toggle==='aisle')state.sim.aisle=!state.sim.aisle;render()});
 document.getElementById('uploadBtn')?.addEventListener('click',openUpload);document.getElementById('guideBtn')?.addEventListener('click',openGuide);document.getElementById('runSim')?.addEventListener('click',runSimulation);document.getElementById('runSim2')?.addEventListener('click',runSimulation);document.getElementById('helpBtn')?.addEventListener('click',()=>toast('README.md includes the architecture, API and demo script'));
 document.getElementById('saveSettings')?.addEventListener('click',()=>toast('Settings saved · thresholds apply to the next processing job'));document.getElementById('calibrateBtn')?.addEventListener('click',()=>{state.page='calibration';render()});document.getElementById('sourcePlane')?.addEventListener('click',e=>addCalibrationPoint('source',e));document.getElementById('floorPlane')?.addEventListener('click',e=>addCalibrationPoint('floor',e));document.getElementById('calClear')?.addEventListener('click',()=>{state.cal={source:[],floor:[],result:null};render()});document.getElementById('solveCal')?.addEventListener('click',solveCalibration);document.getElementById('causalAnalyze')?.addEventListener('click',runCausalAnalysis);document.getElementById('runProof')?.addEventListener('click',async()=>{try{const r=await fetch('/api/proof/summary');if(!r.ok)throw new Error('proof failed');state.proofSummary=await r.json();render();toast('Proof report generated · provenance preserved')}catch(error){toast('Proof API unavailable · run python -m proof.run locally')}});document.getElementById('openProofReadme')?.addEventListener('click',()=>toast('See proof/README.md for the real annotated-clip workflow'));document.getElementById('copyProofCommand')?.addEventListener('click',()=>{navigator.clipboard?.writeText('python -m proof.run --ground-truth data/annotated/ground_truth.json --predictions data/annotated/predictions.json --provenance REAL_ANNOTATED_CLIP --output reports/store-01-proof.json');toast('Real-run command copied')});document.getElementById('refreshActions')?.addEventListener('click',refreshActions);document.getElementById('createAction')?.addEventListener('click',createQuickAction);document.querySelectorAll('[data-complete]').forEach(x=>x.onclick=()=>completeAction(x.dataset.complete));document.querySelectorAll('[data-measure]').forEach(x=>x.onclick=()=>measureAction(x.dataset.measure));document.getElementById('refreshGenome')?.addEventListener('click',refreshGenome);document.getElementById('exportGenome')?.addEventListener('click',()=>toast('Genome export is aggregate-only and excludes identities'));
 document.getElementById('newExp')?.addEventListener('click',()=>toast('Experiment draft created · choose a baseline and matched time window'));
 document.querySelectorAll('[data-prompt]').forEach(x=>x.onclick=()=>{const input=document.getElementById('chatInput');if(input){input.value=x.dataset.prompt;input.focus()}});
 document.getElementById('chatForm')?.addEventListener('submit',e=>{e.preventDefault();const input=document.getElementById('chatInput');const q=input.value.trim();if(q){input.value='';ask(q)}});
}
render();
</script>
</body>
</html>
